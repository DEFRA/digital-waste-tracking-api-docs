name: Sync integration guidance to Confluence

on:
  push:
    branches:
      - Software-provider-guidance
    paths:
      - 'docs/software-provider-integration-guidance.md'
      - 'docs/images/**'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install marked@12

      - name: Sync to Confluence
        env:
          CONFLUENCE_USER: ${{ secrets.CONFLUENCE_USER }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: node .github/scripts/sync-confluence.js
