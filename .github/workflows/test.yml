name: Test

on:
  pull_request:
    paths:
      - 'docs/collections/data/**'
      - 'docs/event-model/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      # Any workflow change: `test` is a required status check, so it must
      # report on every PR that touches CI config or such a PR can never merge
      # (a workflow skipped by path filter leaves the check pending forever).
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'docs/collections/data/**'
      - 'docs/event-model/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm test
