site_name: Digital Waste Tracking - API Docs
site_url: https://defra.github.io/digital-waste-tracking-api-docs
repo_url: https://github.com/DEFRA/digital-waste-tracking-api-docs
remote_branch: gh-pages
theme:
  name: material
  custom_dir: tech_docs_template
  logo: logos/moj.png
  favicon: favicons/moj.ico
  features:
    - announce.dismiss  
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes 
    - content.code.copy
    - search.suggest
    - search.share
    #- content.action.edit
    - content.action.view
    - toc.integrate
    # uncomment to merge TOC with navigation bar
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    admonition:
      quote: octicons/quote-16
    tag:
      draft: material/sticker-outline
      accepted: material/sticker-check-outline
      proposed: material/sticker-plus-outline
      deprecated: material/sticker-minus-outline
      superseded: material/sticker-alert-outline
      rejected: material/sticker-remove-outline
  palette:
    scheme: default
nav:
  - Digital Waste Tracking:
    - About: README.md
    - API spec: api-spec.md
edit_uri: edit/main/docs/
plugins:
  - material/search
  #- git-revision-date-localized
#      type: custom
 #     custom_format: "%d %B %Y"
  #- document-dates:
   #   type: date
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.magiclink
  - tables
  - attr_list
  - toc:
      toc_depth: 1
extra:
  version:
    provider: mike
    default: production
  social:
    - icon: fontawesome/solid/paper-plane 
      link: mailto:wasteuserresearch@defra.gov.uk
      name: "Contact us here"
    - icon: fontawesome/brands/github
      link: https://github.com/defra/waste-tracking-service
      name: "Our DWT service is available here"
  tags:
    Draft: draft
    Accepted: accepted
    Proposed: proposed
    Superseded: superseded
    Deprecated: deprecated
    Rejected: rejected
#  analytics:
#    provider: google

#    property: G-SKK1DY4NVV


