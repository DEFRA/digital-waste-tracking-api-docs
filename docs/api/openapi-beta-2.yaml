openapi: 3.1.0

info:
  title: Digital Waste Tracking API
  version: beta-2
  description: Milestone `beta-2` of the waste-movement journey — creation, collection, delivery and receipt, with data validation. Payload fields are being added a resource at a time; each request schema shows what its endpoint carries so far.

servers:
  - url: https://waste-tracking.integration.api.defra.gov.uk/beta-2
    description: Integration / ext-test (public)

security:
  - bearerAuth: []

tags:
  - name: Movement
    description: Create and manage a waste movement record.
  - name: Collection
    description: Record a collection event — waste passing from a producer to a driver.
  - name: Delivery
    description: Record a delivery event, generating one or more Delivery IDs.
  - name: Receipt
    description: Record receipt of waste at a receiver site.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        AWS Cognito access token, obtained with the OAuth 2.0 client credentials grant (`POST {authBaseUrl}/oauth2/token` with your client ID and secret). Sent as `Authorization: Bearer <token>`.


  parameters:
    movementIdPath:
      name: movementId
      in: path
      required: true
      description: Movement ID minted by `POST /movements`.
      schema:
        $ref: '#/components/schemas/movementId'

    deliveryIdPath:
      name: deliveryId
      in: path
      required: true
      description: Delivery ID minted by `POST /deliveries`.
      schema:
        $ref: '#/components/schemas/deliveryId'

  headers:
    RequestId:
      description: Trace id for this request. Quote it to support if something goes wrong.
      schema:
        type: string
        example: 4c6f9e1a-8f2b-4e3d-9a1c-2b7d5e6f0a3c

  schemas:
    movementId:
      $ref: '../event-model/schemas/beta-2/common/movement-id.schema.json'

    deliveryId:
      $ref: '../event-model/schemas/beta-2/common/delivery-id.schema.json'

    createMovementRequest:
      $ref: '../event-model/schemas/beta-2/creation/create-movement-request.schema.json'

    recordCollectionRequest:
      $ref: '../event-model/schemas/beta-2/collection/create-collection-request.schema.json'

    recordDeliveryRequest:
      $ref: '../event-model/schemas/beta-2/delivery/record-delivery-request.schema.json'

    recordReceiptRequest:
      $ref: '../event-model/schemas/beta-2/receipt/record-receipt-request.schema.json'

    recordReceiptWithoutDeliveryRequest:
      $ref: '../event-model/schemas/beta-2/receipt/record-receipt-without-delivery-request.schema.json'

    issue:
      $ref: '../event-model/schemas/beta-2/common/issue.schema.json'

    problemDetails:
      type: object
      description: RFC 9457 Problem Details (`application/problem+json`).
      required: [type, title, detail, instance, requestId]
      properties:
        type:
          type: string
          format: uri
          description: Stable URI identifying the problem kind.
          example: https://defra.github.io/digital-waste-tracking-api-docs/preview/problems/bad-request
        title:
          type: string
          description: Short, stable summary for this problem type.
          example: Request validation failed
        detail:
          type: string
          description: Human-readable detail specific to this occurrence.
          example: The request could not be stored because 1 field is invalid.
        instance:
          type: string
          description: The request path where the problem occurred.
          example: /movements
        requestId:
          type: string
          description: Trace id for this request, matching the `x-request-id` header.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/issue'
          description: Field-level problems. Present on 400 responses; omitted otherwise.

    createMovementResponse:
      $ref: '../event-model/schemas/beta-2/creation/create-movement-response.schema.json'

    recordCollectionResponse:
      $ref: '../event-model/schemas/beta-2/collection/create-collection-response.schema.json'

    deliveryResponse:
      $ref: '../event-model/schemas/beta-2/delivery/record-delivery-response.schema.json'

    recordReceiptResponse:
      $ref: '../event-model/schemas/beta-2/receipt/record-receipt-response.schema.json'

    recordReceiptWithoutDeliveryResponse:
      $ref: '../event-model/schemas/beta-2/receipt/record-receipt-without-delivery-response.schema.json'

  responses:
    '400':
      description: The request could not be stored (validation, format or state error).
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problemDetails'

    '401':
      description: Missing or invalid authentication.
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problemDetails'

    '500':
      description: Unexpected server error.
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problemDetails'

paths:
  /movements:
    post:
      tags: [Movement]
      summary: Create a waste movement
      description: Creates a new waste movement and returns its Movement ID.
      operationId: createMovement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createMovementRequest'
            examples:
              commercial:
                $ref: '../event-model/schemas/beta-2/creation/create-movement-request.examples.json#/commercial'
              household:
                $ref: '../event-model/schemas/beta-2/creation/create-movement-request.examples.json#/household'
      responses:
        '201':
          description: Movement created. Body carries the new Movement ID and any validation warnings.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createMovementResponse'
              examples:
                commercial:
                  $ref: '../event-model/schemas/beta-2/creation/create-movement-response.examples.json#/commercial'
                household:
                  $ref: '../event-model/schemas/beta-2/creation/create-movement-response.examples.json#/household'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'

  /movements/{movementId}/collection:
    parameters:
      - $ref: '#/components/parameters/movementIdPath'
    post:
      tags: [Collection]
      summary: Record the collection for a movement
      description: Records a collection event for the given movement.
      operationId: recordCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/recordCollectionRequest'
            examples:
              withBrokerAndReferences:
                $ref: '../event-model/schemas/beta-2/collection/create-collection-request.examples.json#/withBrokerAndReferences'
              minimal:
                $ref: '../event-model/schemas/beta-2/collection/create-collection-request.examples.json#/minimal'
      responses:
        '201':
          description: Collection recorded. Body carries any validation warnings.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/recordCollectionResponse'
              examples:
                withBrokerAndReferences:
                  $ref: '../event-model/schemas/beta-2/collection/create-collection-response.examples.json#/withBrokerAndReferences'
                minimal:
                  $ref: '../event-model/schemas/beta-2/collection/create-collection-response.examples.json#/minimal'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          description: Movement not found.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetails'
              example:
                type: https://defra.github.io/digital-waste-tracking-api-docs/preview/problems/not-found
                title: Not Found
                detail: movementId not found
                instance: /movements/25HRA0B2/collection
                requestId: 4c6f9e1a-8f2b-4e3d-9a1c-2b7d5e6f0a3c
        '500':
          $ref: '#/components/responses/500'

  /deliveries:
    post:
      tags: [Delivery]
      summary: Record a delivery
      description: >-
        Records a delivery event and returns one Delivery ID per distinct waste type among the submitted Movements.


      operationId: recordDelivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/recordDeliveryRequest'
            examples:
              twoMovements:
                $ref: '../event-model/schemas/beta-2/delivery/record-delivery-request.examples.json#/twoMovements'
      responses:
        '201':
          description: >-
            Delivery recorded. Body carries a list of the new Delivery(ies) — one per distinct waste type — and any validation warnings.


          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deliveryResponse'
              examples:
                twoMovements:
                  $ref: '../event-model/schemas/beta-2/delivery/record-delivery-response.examples.json#/twoMovements'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'

  /receipts:
    post:
      tags: [Receipt]
      summary: Record receipt of waste without a Delivery ID
      description: >-
        Fallback for recording receipt with no prior Delivery, e.g. waste received with no movement trail. Not linked to any Movement; `reason` must explain why. The server creates an empty Delivery behind the scenes and returns its `deliveryId`, so the receipt stays addressable.


      operationId: recordReceiptWithoutDelivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/recordReceiptWithoutDeliveryRequest'
            examples:
              withReason:
                $ref: '../event-model/schemas/beta-2/receipt/record-receipt-without-delivery-request.examples.json#/withReason'
      responses:
        '201':
          description: >-
            Receipt recorded against a server-created empty Delivery. Body carries the new Delivery ID and any validation warnings.


          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/recordReceiptWithoutDeliveryResponse'
              examples:
                withReason:
                  $ref: '../event-model/schemas/beta-2/receipt/record-receipt-without-delivery-response.examples.json#/withReason'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'

  /deliveries/{deliveryId}/receipt:
    parameters:
      - $ref: '#/components/parameters/deliveryIdPath'
    post:
      tags: [Receipt]
      summary: Record receipt of waste against a delivery
      description: Records receipt of the waste delivered under the given delivery.
      operationId: recordReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/recordReceiptRequest'
            examples:
              withBrokerAndReferences:
                $ref: '../event-model/schemas/beta-2/receipt/record-receipt-request.examples.json#/withBrokerAndReferences'
      responses:
        '201':
          description: Receipt recorded against the delivery. Body carries the Delivery ID and any validation warnings.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/recordReceiptResponse'
              examples:
                withBrokerAndReferences:
                  $ref: '../event-model/schemas/beta-2/receipt/record-receipt-response.examples.json#/withBrokerAndReferences'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          description: Delivery not found.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetails'
              example:
                type: https://defra.github.io/digital-waste-tracking-api-docs/preview/problems/not-found
                title: Not Found
                detail: 'No delivery exists with delivery ID: 25KMT4Z9'
                instance: /deliveries/25KMT4Z9/receipt
                requestId: 4c6f9e1a-8f2b-4e3d-9a1c-2b7d5e6f0a3c
        '500':
          $ref: '#/components/responses/500'
