                    examples:
                      - producer is required.
              description: Data-quality warnings. Empty when there are none.
    deliveryResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: Record delivery response
      description: Response returned when a delivery is recorded.
      type: object
      required:
        - data
        - validation
      properties:
        data:
          type: object
          description: The Deliveries minted by the request.
          required:
            - deliveries
          properties:
            deliveries:
              type: array
              items:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Delivery item
                description: A single Delivery minted from a `POST /deliveries` request, covering the Movements sharing one waste type.
                examples:
                  - deliveryId: 25KMT4Z9
                    movementIds:
                      - 25HRA0B2
                      - 25HRA0B3
                    wasteType: NON_HAZARDOUS
                type: object
                required:
                  - deliveryId
                  - movementIds
                  - wasteType
                properties:
                  deliveryId:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Delivery ID
                    description: 'Unique identifier for a delivery, minted by the server on `POST /deliveries`. Format: a two-digit year prefix followed by six or seven characters from A–Z and 0–9, 8 or 9 characters in all. Movement IDs and Delivery IDs share this format. Treat it as opaque: don''t parse it.'
                    type: string
                    pattern: ^[0-9]{2}[A-Z0-9]{6,7}$
                    examples:
                      - 25KMT4Z9
                  movementIds:
                    type: array
                    minItems: 1
                    items:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      title: Movement ID
                      description: 'Unique identifier for a waste movement, minted by the server on `POST /movements`. Format: a two-digit year prefix followed by six or seven characters from A–Z and 0–9, 8 or 9 characters in all. Movement IDs and Delivery IDs share this format. Treat it as opaque: don''t parse it.'
                      type: string
                      pattern: ^[0-9]{2}[A-Z0-9]{6,7}$
                      examples:
                        - 25HRA0B2
                    description: The subset of the submitted Movement IDs covered by this Delivery.
                  wasteType:
