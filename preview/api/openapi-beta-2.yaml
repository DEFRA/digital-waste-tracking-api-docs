              $schema: https://json-schema.org/draft/2020-12/schema
              title: Registration number
              type: string
              pattern: ^\s*(?:[Cc][Bb][Dd][LlUu]\d{3,}|[Ww][Cc][Rr]/[Rr]/\d{7}|(?:[Ss][Cc][Oo]|[Ss][Ee][Aa]|[Ss][Nn][Oo]|[Ss][Ww][Ee]|[Ww][Cc][Rr])/\d{6}|[Pp][Cc][Tt]-[A-Za-z]-\d{3,7}|[Rr][Oo][Cc]\W*[UuLl][Tt]\W*\d{1,5})\s*$
            reasonForNoRegistrationNumber:
              type: string
              enum:
                - ON_SITE
                - HOUSEHOLD
                - ONE_OFF
                - MARINE
              description: Why the carrier has no registration number. Mutually exclusive with registrationNumber — exactly one of the two is required.
            meansOfTransport:
              type: string
              enum:
                - Road
                - Rail
                - Air
                - Sea
                - Inland Waterway
                - Piped
                - Other
              description: How the carrier will transport the waste.
            vehicleRegistration:
              type: string
              minLength: 1
              description: Registration of the vehicle carrying the waste. Required when meansOfTransport is Road; forbidden otherwise.
            otherMeansOfTransport:
              type: string
              minLength: 1
              description: Description of the means of transport. Required when meansOfTransport is Other; forbidden otherwise.
            contactDetails:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Contact details
              description: Contact details for a party. At least one of emailAddress or phoneNumber must be provided.
              examples:
                - emailAddress: producer@example.com
                  phoneNumber: '01234567890'
                - emailAddress: producer@example.com
              type: object
              properties:
                emailAddress:
                  type: string
                  format: email
                  description: Contact email address.
                phoneNumber:
                  type: string
                  pattern: ^\s*(?=(?:\D*\d){7,15}\D*$)\+?[0-9()\-\s]+$
                  description: Contact phone number, in a valid format.
              anyOf:
                - properties:
                    emailAddress: {}
                  required:
                    - emailAddress
                - properties:
                    phoneNumber: {}
                  required:
                    - phoneNumber
            address:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Address
              description: A UK or Irish postal address. fullAddress is optional; postcode is required.
              examples:
                - fullAddress: 10 Industrial Way, Test City
                  postcode: TE1 2PQ
              type: object
              properties:
                fullAddress:
                  type: string
                  minLength: 1
                  description: Full address line.
                postcode:
                  type: string
                  pattern: ^\s*(?:(?:(([Gg][Ii][Rr] 0[Aa]{2})|((([A-Za-z]\d{1,2})|(([A-Za-z][A-Ha-hJ-Yj-y]\d{1,2})|(([A-Za-z]\d[A-Za-z])|([A-Za-z][A-Ha-hJ-Yj-y]\d?[A-Za-z])))) \d[A-Za-z]{2})))|(?:(?:[Dd]6[Ww]|[AaC-Fc-fHhKkNnPpRrTtV-Yv-y]\d{2}) ?[0-9AaC-Fc-fHhKkNnPpRrTtV-Yv-y]{4}))\s*$
                  description: Accepts UK postcodes and Irish Eircodes.
              required:
                - postcode
          required:
            - organisationName
            - meansOfTransport
            - contactDetails
          additionalProperties: false
        receiver:
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Receiver
          description: A single intended receiver. siteName, authorisationNumber, receiptAddress and contactDetails are all required.
          type: object
          properties:
            siteName:
              type: string
              minLength: 1
              description: Name of the receiving site.
            authorisationNumber:
              description: Receiver environmental permit or exemption number, in a valid UK format.
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Authorisation number
              type: string
              pattern: ^\s*(?:(?:[A-Za-z]{2}\d{4}[A-Za-z]{2})|(?:[A-Za-z]{2}\d{4}[A-Za-z]{2}\/[Dd]\d{4,5})|(?:[Ee][Pp][Rr]\/[A-Za-z]{2}\d{4}[A-Za-z]{2})|(?:[Ee][Pp][Rr]\/[A-Za-z]{2}\d{4}[A-Za-z]{2}\/[Dd]\d{4,5})|(?:[Ee][Aa][Ww][Mm][Ll]\d{5,6})|(?:[Ww][Mm][Ll]\d{5,6})|(?:[Pp][Pp][Cc]\/[AaWwEeNn]\/\d{7})|(?:[Ww][Mm][Ll]\/[LlWwEeNn]\/\d{7})|(?:[Ww][Mm][Ll]\/[LlWwEeNn]\/\d{7}\/\d{2})|(?:[Pp][Pp][Cc]\/[Aa]\/[Ss][Ee][Pp][Aa]\d{4}-\d{4})|(?:[Ww][Mm][Ll]\/[Ll]\/[Ss][Ee][Pp][Aa]\d{4}-\d{4})|(?:[Ee][Aa][Ss]\/[Pp]\/\d{6})|(?:[Pp]\d{4}\/\d{2}[A-Za-z])|(?:[Pp]\d{4}\/\d{2}[A-Za-z]\/[Vv]\d+)|(?:[Ww][Pp][Pp][Cc] \d{2}\/\d{2})|(?:[Ww][Pp][Pp][Cc] \d{2}\/\d{2}\/[Vv]\d+)|(?:[Ww][Mm][Ll] \d{2}\/\d+(\/[Tt])? [Ll][Nn]\/\d{2}\/\d+(\/([MmTtCcNn]|[Vv]\d+))*)|(?:[Ww][Mm][Ll] \d{2}\/\d+ [Pp][Aa][Cc]\/\d{4}\/[Ww][Cc][Ll]\d{3}))\s*$
            receiptAddress:
              description: Address the waste will be received at. postcode is required; fullAddress is optional.
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Address
              examples:
                - fullAddress: 10 Industrial Way, Test City
                  postcode: TE1 2PQ
              type: object
              properties:
                fullAddress:
                  type: string
                  minLength: 1
                  description: Full address line.
                postcode:
                  type: string
                  pattern: ^\s*(?:(?:(([Gg][Ii][Rr] 0[Aa]{2})|((([A-Za-z]\d{1,2})|(([A-Za-z][A-Ha-hJ-Yj-y]\d{1,2})|(([A-Za-z]\d[A-Za-z])|([A-Za-z][A-Ha-hJ-Yj-y]\d?[A-Za-z])))) \d[A-Za-z]{2})))|(?:(?:[Dd]6[Ww]|[AaC-Fc-fHhKkNnPpRrTtV-Yv-y]\d{2}) ?[0-9AaC-Fc-fHhKkNnPpRrTtV-Yv-y]{4}))\s*$
                  description: Accepts UK postcodes and Irish Eircodes.
              required:
                - postcode
            contactDetails:
              description: How to contact the receiving site. At least one of emailAddress or phoneNumber is required.
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Contact details
              examples:
                - emailAddress: producer@example.com
                  phoneNumber: '01234567890'
                - emailAddress: producer@example.com
              type: object
              properties:
                emailAddress:
                  type: string
                  format: email
                  description: Contact email address.
                phoneNumber:
                  type: string
                  pattern: ^\s*(?=(?:\D*\d){7,15}\D*$)\+?[0-9()\-\s]+$
                  description: Contact phone number, in a valid format.
              anyOf:
                - properties:
                    emailAddress: {}
                  required:
                    - emailAddress
                - properties:
                    phoneNumber: {}
                  required:
                    - phoneNumber
          required:
            - siteName
            - authorisationNumber
            - receiptAddress
            - contactDetails
          additionalProperties: false
        wasteItems:
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Waste items
          description: The items of waste in a movement. At least one is required.
          type: array
          minItems: 1
          items:
            $schema: https://json-schema.org/draft/2020-12/schema
            title: Waste item
            description: A single item of waste in a movement. physicalDetails is required.
            examples:
              - physicalDetails:
                  form: SOLID
                  containerType: DRU
                  containerCount: 4
                  totalWeight:
                    amount: 250.5
                    unit: KILOGRAMS
                    isEstimate: false
              - physicalDetails:
                  form: MIXED
                  containerType: LOO
                  containerCount: 0
                  totalWeight:
                    amount: 2
                    unit: TONNES
                    isEstimate: true
            type: object
            properties:
              physicalDetails:
                description: The physical form, containers and total weight of the waste item.
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Physical details
                type: object
                allOf:
                  - if:
                      properties:
                        containerType:
                          const: LOO
                      required:
                        - containerType
                    then:
                      properties:
                        containerCount:
                          const: 0
                          description: Must be 0 when the waste is loose (containerType LOO).
                    else:
                      properties:
                        containerCount:
                          type: integer
                          minimum: 1
                          description: Must be at least 1 unless the waste is loose (containerType LOO).
                properties:
                  form:
                    type: string
                    enum:
                      - GAS
                      - LIQUID
                      - SOLID
                      - POWDER
                      - SLUDGE
                      - MIXED
                    description: The physical form of the waste. Case-sensitive.
                  containerType:
                    type: string
                    enum:
                      - BAG
                      - BAL
                      - BOX
                      - CAN
                      - CAR
                      - CAS
                      - CON
                      - DRU
                      - FIB
                      - IBC
                      - LOO
                      - PAL
                      - ROR
                      - SKI
                      - TAN
                      - WBI
                    description: Code for how the waste is contained. LOO means the waste is loose, with no containers. Case-sensitive.
                  containerCount:
                    type: integer
                    minimum: 0
                    description: 'The number of containers: a whole number of 0 or more. Must be 0 when containerType is LOO, and at least 1 for any other container type.'
                  totalWeight:
                    description: The total weight of the waste item.
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Weight
                    type: object
                    properties:
                      amount:
                        type: number
                        exclusiveMinimum: 0
                        description: The weight, in the given unit. Must be greater than 0.
                      unit:
                        type: string
                        enum:
                          - GRAMS
                          - KILOGRAMS
                          - TONNES
                        description: The unit the amount is measured in. Case-sensitive.
                      isEstimate:
                        type: boolean
                        description: Whether the weight is estimated (true) or actual (false).
                    required:
                      - amount
                      - unit
                      - isEstimate
                    additionalProperties: false
                required:
                  - form
                  - containerType
                  - containerCount
                  - totalWeight
                additionalProperties: false
            required:
              - physicalDetails
            additionalProperties: false
        brokerOrDealer:
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Broker or dealer involvement
          description: 'Declares whether any broker or dealer was involved in the movement, and their details. isPresent gates the items array: when true at least one entry is required, when false or absent entries are forbidden.'
          examples:
            - isPresent: true
              items:
                - organisationName: Broker Demo Ltd
                  registrationNumber: CBDU654321
                  contactDetails:
                    emailAddress: broker@example.com
                    phoneNumber: '01112223333'
                  address:
                    fullAddress: 2 Broker Yard, Test City
                    postcode: TE1 1ST
            - isPresent: false
          type: object
          oneOf:
            - required:
                - isPresent
                - items
              properties:
                isPresent:
                  const: true
                items:
                  type: array
                  minItems: 1
            - properties:
                isPresent:
                  const: false
                items:
                  not: {}
                  description: Not allowed when isPresent is false or absent.
          properties:
            isPresent:
              type: boolean
              description: Whether a broker or dealer was involved in arranging the movement. Absent is equivalent to false.
            items:
              type: array
              items:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Broker or dealer
                description: A single broker or dealer who arranged the transfer. organisationName and contactDetails are required, and exactly one of registrationNumber or reasonForNoRegistrationNumber must be provided. address is optional.
                examples:
                  - organisationName: Broker Demo Ltd
                    registrationNumber: CBDU654321
                    contactDetails:
                      emailAddress: broker@example.com
                      phoneNumber: '01112223333'
                    address:
                      fullAddress: 2 Broker Yard, Test City
                      postcode: TE1 1ST
                  - organisationName: Broker Demo Ltd
                    reasonForNoRegistrationNumber: ONE_OFF
                    contactDetails:
                      emailAddress: broker@example.com
                type: object
                oneOf:
                  - required:
                      - registrationNumber
                    properties:
                      registrationNumber: {}
                      reasonForNoRegistrationNumber:
                        not: {}
                        description: Not allowed when registrationNumber is provided.
                  - required:
                      - reasonForNoRegistrationNumber
                    properties:
                      registrationNumber:
                        not: {}
                        description: Not allowed when reasonForNoRegistrationNumber is provided.
                      reasonForNoRegistrationNumber: {}
                properties:
                  organisationName:
                    type: string
                    minLength: 1
                    description: Name of the broker or dealer organisation who arranged this transfer.
                  registrationNumber:
                    description: Waste carrier, broker or dealer registration number, in a valid UK home-nation format (England and NRW CBDU/CBDL, SEPA WCR/SCO/SEA/SNO/SWE and PCT, NI ROC UT/LT). Mutually exclusive with reasonForNoRegistrationNumber — exactly one of the two is required.
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Registration number
                    type: string
                    pattern: ^\s*(?:[Cc][Bb][Dd][LlUu]\d{3,}|[Ww][Cc][Rr]/[Rr]/\d{7}|(?:[Ss][Cc][Oo]|[Ss][Ee][Aa]|[Ss][Nn][Oo]|[Ss][Ww][Ee]|[Ww][Cc][Rr])/\d{6}|[Pp][Cc][Tt]-[A-Za-z]-\d{3,7}|[Rr][Oo][Cc]\W*[UuLl][Tt]\W*\d{1,5})\s*$
                  reasonForNoRegistrationNumber:
                    type: string
                    minLength: 1
                    description: Reason no registrationNumber is held. Free text for now — enum values TBC pending BA/policy input. Mutually exclusive with registrationNumber — exactly one of the two is required.
                  contactDetails:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Contact details
                    description: Contact details for a party. At least one of emailAddress or phoneNumber must be provided.
                    examples:
                      - emailAddress: producer@example.com
                        phoneNumber: '01234567890'
                      - emailAddress: producer@example.com
                    type: object
                    properties:
                      emailAddress:
                        type: string
                        format: email
                        description: Contact email address.
                      phoneNumber:
                        type: string
                        pattern: ^\s*(?=(?:\D*\d){7,15}\D*$)\+?[0-9()\-\s]+$
                        description: Contact phone number, in a valid format.
                    anyOf:
                      - properties:
                          emailAddress: {}
                        required:
                          - emailAddress
                      - properties:
                          phoneNumber: {}
                        required:
                          - phoneNumber
                  address:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Address
                    description: A UK or Irish postal address. fullAddress is optional; postcode is required.
                    examples:
                      - fullAddress: 10 Industrial Way, Test City
                        postcode: TE1 2PQ
                    type: object
                    properties:
                      fullAddress:
                        type: string
                        minLength: 1
                        description: Full address line.
                      postcode:
                        type: string
                        pattern: ^\s*(?:(?:(([Gg][Ii][Rr] 0[Aa]{2})|((([A-Za-z]\d{1,2})|(([A-Za-z][A-Ha-hJ-Yj-y]\d{1,2})|(([A-Za-z]\d[A-Za-z])|([A-Za-z][A-Ha-hJ-Yj-y]\d?[A-Za-z])))) \d[A-Za-z]{2})))|(?:(?:[Dd]6[Ww]|[AaC-Fc-fHhKkNnPpRrTtV-Yv-y]\d{2}) ?[0-9AaC-Fc-fHhKkNnPpRrTtV-Yv-y]{4}))\s*$
                        description: Accepts UK postcodes and Irish Eircodes.
                    required:
                      - postcode
                required:
                  - organisationName
                  - contactDetails
                additionalProperties: false
              description: The brokers or dealers involved. Required with at least one entry when isPresent is true, and must not be provided otherwise. More than one may be declared.
          additionalProperties: false
        supportingReferences:
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Supporting references
          description: label/reference pairs for the movement. Both reference and label are required for every entry.
          examples:
            - - label: PO Number
                reference: PO-123456
              - label: Job Number
                reference: CARRIER-JOB-001
          type: array
          minItems: 1
          items:
            type: object
            properties:
              reference:
                type: string
                minLength: 1
                maxLength: 50
                description: Reference value — must be supplied together with its label.
              label:
                type: string
                enum:
                  - Weighbridge Number
                  - PO Number
                  - Job Number
                  - Invoice Number
                  - Waste Ticket Number
                  - Other
                description: Label identifying the reference type.
            required:
              - reference
              - label
            additionalProperties: false
      required:
        - reason
        - carrier
        - receiver
        - wasteItems
      additionalProperties: false
    issue:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: Issue
      description: A single problem with a submitted field, located by JSON Pointer.
      type: object
      required:
        - pointer
        - errorType
        - message
      properties:
        pointer:
          type: string
          description: RFC 6901 JSON Pointer to the field this issue relates to.
          examples:
            - /producer
        errorType:
          type: string
          enum:
            - NotProvided
            - NotAllowed
            - InvalidType
            - InvalidFormat
            - InvalidValue
            - OutOfRange
            - BusinessRuleViolation
            - UnexpectedError
          description: The type of issue.
          examples:
            - NotProvided
        message:
          type: string
          description: Human-readable description of the issue.
          examples:
            - producer is required.
    problemDetails:
      type: object
      description: RFC 9457 Problem Details (`application/problem+json`).
      required:
        - type
        - title
        - detail
        - instance
        - requestId
      properties:
        type:
          type: string
          format: uri
          description: Stable URI identifying the problem kind.
          example: https://defra.github.io/digital-waste-tracking-api-docs/preview/problems/bad-request
        title:
          type: string
          description: Short, stable summary for this problem type.
          example: Request validation failed
        detail:
          type: string
          description: Human-readable detail specific to this occurrence.
          example: The request could not be stored because 1 field is invalid.
        instance:
          type: string
          description: The request path where the problem occurred.
          example: /movements
        requestId:
          type: string
          description: Trace id for this request, matching the `x-request-id` header.
        errors:
          type: array
          items:
            $schema: https://json-schema.org/draft/2020-12/schema
            title: Issue
            description: A single problem with a submitted field, located by JSON Pointer.
            type: object
            required:
              - pointer
              - errorType
              - message
            properties:
              pointer:
                type: string
                description: RFC 6901 JSON Pointer to the field this issue relates to.
                examples:
                  - /producer
              errorType:
                type: string
                enum:
                  - NotProvided
                  - NotAllowed
                  - InvalidType
                  - InvalidFormat
                  - InvalidValue
                  - OutOfRange
                  - BusinessRuleViolation
                  - UnexpectedError
                description: The type of issue.
                examples:
                  - NotProvided
              message:
                type: string
                description: Human-readable description of the issue.
                examples:
                  - producer is required.
          description: Field-level problems. Present on 400 responses; omitted otherwise.
    createMovementResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: Create movement response
      description: Response returned when a movement is created.
      type: object
      required:
        - data
        - validation
      properties:
        data:
          type: object
          description: The created movement.
          required:
            - movementId
          properties:
            movementId:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Movement ID
              description: 'Unique identifier for a waste movement, minted by the server on `POST /movements`. Format: a two-digit year prefix followed by six or seven characters from A–Z and 0–9, 8 or 9 characters in all. Movement IDs and Delivery IDs share this format. Treat it as opaque: don''t parse it.'
              type: string
              pattern: ^[0-9]{2}[A-Z0-9]{6,7}$
              examples:
                - 25HRA0B2
        validation:
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Validation
          description: Data-quality feedback returned alongside a successful response.
          examples:
            - warnings: []
          type: object
          required:
            - warnings
          properties:
            warnings:
              type: array
              items:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Issue
                description: A single problem with a submitted field, located by JSON Pointer.
                type: object
                required:
                  - pointer
                  - errorType
                  - message
                properties:
                  pointer:
                    type: string
                    description: RFC 6901 JSON Pointer to the field this issue relates to.
                    examples:
                      - /producer
                  errorType:
                    type: string
                    enum:
                      - NotProvided
                      - NotAllowed
                      - InvalidType
                      - InvalidFormat
                      - InvalidValue
                      - OutOfRange
                      - BusinessRuleViolation
                      - UnexpectedError
                    description: The type of issue.
                    examples:
                      - NotProvided
                  message:
                    type: string
                    description: Human-readable description of the issue.
                    examples:
                      - producer is required.
              description: Data-quality warnings. Empty when there are none.
